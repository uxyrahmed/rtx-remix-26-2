# Vivid look at night: thin moonlit mist and a soft glow around light sources.
# The four Vivid time files name the same options so each one animates into
# the next; see Endpoints in the authoring guide.
# Authoring guide: ../../../README.md

# Haze over the 256 m volumetric range; moonlight scatters forward through it.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 256.0
rtx.volumetrics.transmittanceColor = 0.92, 0.925, 0.935
rtx.volumetrics.anisotropy = 0.55

# Night admits dimmer emitters than day, more gently than the shipped night.
rtx.bloom.luminanceThreshold = 2
rtx.bloom.burnIntensity = 0.8

# The shipped night cap: a dark sky never drives exposure down.
rtx.autoExposure.evMaxValue = -0.5
