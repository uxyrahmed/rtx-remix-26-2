# Vivid look at night: dark and moonlit, with thin mist that moonlight and
# light sources scatter through.
# The four Vivid time files name the same options so each one animates into
# the next; see Endpoints in the authoring guide.
# Authoring guide: ../../../README.md

# Haze over the 256 m volumetric range; moonlight scatters forward through it.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 256.0
rtx.volumetrics.transmittanceColor = 0.87, 0.875, 0.89
rtx.volumetrics.anisotropy = 0.6

# A soft glow around light sources that stays off their faces, so they keep
# their texture detail.
rtx.bloom.luminanceThreshold = 4
rtx.bloom.burnIntensity = 0.45

# Eye adaptation may lift a dark night only a little, so night stays night,
# and may darken near bright lights so they keep their detail.
rtx.autoExposure.evMaxValue = 0.5
rtx.autoExposure.evMinValue = -1.4
