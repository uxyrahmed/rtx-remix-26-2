# Vivid look, every time of day and every dimension. Active only while the
# player selects the Vivid look (settings: Lighting > Look, or /rtx look vivid).
# The look also warms the sunlight, cools the moonlight, softens the sun's halo,
# and adds ozone and saturation to the sky; those live in the mod, not a conf.
# Options that change with the time of day belong in the four time files here.
# Authoring guide: ../../../README.md

# Keep the haze bright rather than smoky, so light shafts read as light.
rtx.volumetrics.enable = True
rtx.volumetrics.singleScatteringAlbedo = 0.98, 0.98, 0.98

# More contrast than the shipped look without crushing shadows: slightly
# deeper shadow areas and brighter highlights, plus local detail contrast.
rtx.localtonemap.shadows = 1.2
rtx.localtonemap.highlights = 2.2
rtx.localtonemap.boostLocalContrast = True

# The luminance-only ACES keeps saturated colour in bright light where the
# refined transform fades it towards white.
rtx.useLegacyACES = True

# A gentle vignette.
rtx.postfx.enableVignette = True
rtx.postfx.vignetteIntensity = 0.3
rtx.postfx.vignetteRadius = 0.8
rtx.postfx.vignetteSoftness = 0.6
