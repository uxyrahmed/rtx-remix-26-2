# Vivid look by day: light blue haze and soft bloom on the hottest emitters.
# The four Vivid time files name the same options so each one animates into
# the next; see Endpoints in the authoring guide.
# Authoring guide: ../../../README.md

# Haze over the 256 m volumetric range; thin and neutral, so the warm sun and
# the blue sky colour it.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 256.0
rtx.volumetrics.transmittanceColor = 0.95, 0.95, 0.955
rtx.volumetrics.anisotropy = 0.65

# Bloom that leaves sunlit surfaces alone and glows only around the sun,
# bright highlights, and strong emitters.
rtx.bloom.luminanceThreshold = 30
rtx.bloom.burnIntensity = 0.25

# The baseline exposure range, named here so dawn and dusk animate into it.
rtx.autoExposure.evMaxValue = 1.5
