# Vivid look at dusk: golden haze with light shafts towards the setting sun.
# The four Vivid time files name the same options so each one animates into
# the next; see Endpoints in the authoring guide.
# Authoring guide: ../../../README.md

# Haze over the 256 m volumetric range, strongly forward scattering.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 256.0
rtx.volumetrics.transmittanceColor = 0.89, 0.895, 0.905
rtx.volumetrics.anisotropy = 0.82

# Bloom around the low sun and the brightest emitters.
rtx.bloom.luminanceThreshold = 12
rtx.bloom.burnIntensity = 0.35

# Let exposure come down for a bright sky over the sunset, so the sky keeps
# its colour and the land turns to silhouette instead of the sky burning out.
rtx.autoExposure.evMaxValue = 0.5
