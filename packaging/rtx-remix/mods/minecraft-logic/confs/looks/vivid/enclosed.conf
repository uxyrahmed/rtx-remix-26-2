# Vivid look wherever the sky cannot reach: caves, ruins' interiors, roofed
# rooms. Strength follows the sky light where the camera stands, eased, times
# the look's own strength. It sits above weather, since rain never falls here,
# and replaces the time of day's haze, bloom and exposure, so a cave looks the
# same at noon and at midnight.
# Authoring guide: ../../../README.md

# Thicker, softly scattering haze, so torch, lantern, lamp and lava light
# glows through the air around its source.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 40.0
rtx.volumetrics.transmittanceColor = 0.82, 0.82, 0.82
rtx.volumetrics.anisotropy = 0.35

# A soft glow around light sources that stays off their faces.
rtx.bloom.luminanceThreshold = 4
rtx.bloom.burnIntensity = 0.4

# The full exposure range: a dark cave may brighten, and exposure may come
# down near bright lights so they keep their detail.
rtx.autoExposure.evMaxValue = 1.5
rtx.autoExposure.evMinValue = -2.5
